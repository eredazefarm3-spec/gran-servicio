<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geografía — Gran Servicio</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/gs-polish.css"><link rel="stylesheet" href="../css/dashboard.css"><link rel="stylesheet" href="../css/dashboard-v2.css"><link rel="stylesheet" href="../css/maps.css"><link rel="stylesheet" href="../css/panel-life.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script><link rel="stylesheet" href="../css/life.css">
</head><body><div class="app-shell"><aside class="sidebar"><a href="../index.html" class="logo"><img src="../img/logo.png" alt="Gran Servicio" class="logo-img"><span>GRAN SERVICIO</span></a><ul class="sidebar-nav"><li><a href="dashboard.html">Dashboard</a></li><li><a href="catalogos.html">Catálogos</a></li><li><a href="pagos.html">Pagos</a></li><li><a href="solicitudes.html">Solicitudes</a></li><li><a href="geografia.html" class="active">Geografía</a></li></ul><div class="sidebar-foot"><button class="btn btn-ghost btn-sm" onclick="gsLogout()">Cerrar sesión</button></div></aside><main class="app-main"><div class="topbar"><button class="hamburger-menu btn btn-outline btn-sm" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button><div></div><div class="topbar-user"><span id="nombre"></span></div></div><div class="main-content"><div class="flex-between"><div><h2>Geografía de Córdoba</h2><p class="muted">Datos geográficos persistidos y sincronizados desde fuentes oficiales.</p></div><button id="sync" class="btn btn-accent">SINCRONIZAR TODA CÓRDOBA</button></div><div class="stat-grid" id="stats"></div><div class="map-wrap map-tall" style="margin-top:20px"><div id="map"></div></div><div id="tabla" class="panel" style="margin-top:20px"></div></div></main></div><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/mapas.js"></script><script>(async()=>{const s=await gsProtegerPagina('empleado');if(!s)return;document.getElementById('nombre').textContent=s.perfil.nombre+' '+s.perfil.apellido;const m=gsCrearMapa('map',{zoom:8});await gsCargarGeografiaCordoba(m);async function load(){const {data,count}=await supabaseClient.from('lugares_geograficos').select('id_lugar,nombre,tipo,categoria,departamento,municipio,localidad_censal,latitud,longitud,fuente,actualizado_en',{count:'exact'}).eq('activo',true).eq('provincia_codigo','14').order('nombre').limit(100);const by={};(data||[]).forEach(x=>by[x.tipo]=(by[x.tipo]||0)+1);document.getElementById('stats').innerHTML=Object.entries(by).map(([k,v])=>`<div class="stat-card"><div class="label">${k.replaceAll('_',' ')}</div><div class="value">${v}</div></div>`).join('')+`<div class="stat-card"><div class="label">Total</div><div class="value">${count||0}</div></div>`;document.getElementById('tabla').innerHTML=`<h3>Últimos registros consultados</h3><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Tipo</th><th>Departamento</th><th>Municipio</th><th>Fuente</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${gsEscapeHtml(x.nombre)}</td><td>${gsEscapeHtml(x.tipo)}</td><td>${gsEscapeHtml(x.departamento||'—')}</td><td>${gsEscapeHtml(x.municipio||'—')}</td><td>${gsEscapeHtml(x.fuente||'—')}</td></tr>`).join('')}</tbody></table></div>`}await load();document.getElementById('sync').onclick=async()=>{const b=document.getElementById('sync');b.disabled=true;b.textContent='SINCRONIZANDO…';const {data,error}=await supabaseClient.functions.invoke('sync-cordoba-geography',{body:{}});if(error||data?.error)gsToast(data?.error||'No se pudo sincronizar Córdoba. Revisá la configuración de la función.','error');else gsToast(`Sincronización completada: ${data.total||data.inserted||0} registros procesados.`,'success');b.disabled=false;b.textContent='SINCRONIZAR TODA CÓRDOBA';await load()}})();</script><script src="../js/panel-life.js"></script><script src="../js/life.js"></script>
</body></html>
