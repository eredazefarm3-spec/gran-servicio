<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reclamos — Gran Servicio</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/gs-polish.css">
<link rel="stylesheet" href="../css/dashboard.css"><link rel="stylesheet" href="../css/dashboard-v2.css">
<link rel="stylesheet" href="../css/panel-life.css"><link rel="stylesheet" href="../css/responsive.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="../css/life.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a href="../index.html" class="logo"><img src="../img/logo.png" alt="Gran Servicio" class="logo-img"><span>GRAN SERVICIO</span></a>
    <ul class="sidebar-nav"><li><a href="dashboard.html">Dashboard</a></li><li><a href="clientes.html">Clientes</a></li><li><a href="profesionales.html">Profesionales</a></li><li><a href="empleados.html">Empleados</a></li><li><a href="solicitudes.html">Solicitudes</a></li><li><a href="propuestas.html">Propuestas</a></li><li><a href="asignaciones.html">Asignaciones</a></li><li><a href="pagos.html">Pagos</a></li><li><a href="transacciones.html">Transacciones</a></li><li><a href="facturas.html">Facturas</a></li><li><a href="comisiones.html">Comisiones</a></li><li><a href="reclamos.html" class="active">Reclamos</a></li><li><a href="soporte.html">Soporte</a></li><li><a href="suscripciones.html">Suscripciones</a></li><li><a href="geografia.html">Geografía</a></li><li><a href="catalogos.html">Catálogos</a></li></ul>
    <div class="sidebar-foot"><button class="btn btn-ghost btn-sm" style="color:#CFE0EE" onclick="gsLogout()">Cerrar sesión</button></div>
  </aside>
  <main class="app-main">
    <div class="topbar">
      <button class="hamburger-menu btn btn-outline btn-sm" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div></div><div class="topbar-user"><span id="nombre-usuario"></span><div class="avatar" id="avatar-usuario">--</div></div>
    </div>
    <div class="main-content">
      <h2>Reclamos</h2>
      <div id="contenido-pagina" class="panel"><div class="loading-state"><div class="spinner"></div>Cargando…</div></div>
    </div>
  </main>
</div>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script>
(async () => {
  const sesion = await gsProtegerPagina("empleado");
  if (!sesion) return;
  document.getElementById("nombre-usuario").textContent = sesion.perfil.nombre + " " + sesion.perfil.apellido;
  document.getElementById("avatar-usuario").textContent = (sesion.perfil.nombre[0] + (sesion.perfil.apellido[0]||"")).toUpperCase();
  window.SESION = sesion;
  window.dispatchEvent(new Event("gs-sesion-lista"));
})();
</script>
<script>
window.addEventListener("gs-sesion-lista", async () => {
  const { data } = await supabaseClient.from("reclamos")
    .select("id_reclamo, descripcion, fecha_creacion, resolucion, estados(nombre), tipos_reclamo(nombre), usuario_cliente(nombre,apellido)")
    .order("fecha_creacion",{ascending:false});
  document.getElementById("contenido-pagina").innerHTML = (data && data.length) ? data.map(r => `
    <div class="list-row"><div>
      <strong>${gsEscapeHtml(r.tipos_reclamo?.nombre||"Reclamo")}</strong> — ${gsEscapeHtml(r.usuario_cliente?.nombre||"")} ${gsEscapeHtml(r.usuario_cliente?.apellido||"")}
      <p class="muted" style="margin:2px 0">${gsEscapeHtml(r.descripcion)}</p></div>
      <div style="text-align:right">
        <span class="badge badge-alerta">${gsEscapeHtml(r.estados?.nombre||"—")}</span><br>
        <button class="btn btn-outline btn-sm" style="margin-top:6px" onclick="gsResolverReclamo('${r.id_reclamo}')">Marcar resuelto</button>
      </div></div>`).join("") : '<div class="empty-state">Sin reclamos todavía.</div>';
});
async function gsResolverReclamo(id) {
  const resolucion = prompt("Descripción de la resolución:");
  if (!resolucion) return;
  const { data: estado } = await supabaseClient.from("estados").select("id_estado").eq("tipo_entidad","reclamo").eq("nombre","Resuelto").single();
  const { perfil } = window.SESION;
  await supabaseClient.from("reclamos").update({ resolucion, id_estado: estado?.id_estado, id_empleado_asignado: perfil.id_empleado }).eq("id_reclamo", id);
  gsToast("Reclamo marcado como resuelto.", "success");
  setTimeout(()=>window.location.reload(), 800);
}
</script>
<script src="../js/panel-life.js"></script><script src="../js/life.js"></script>
</body></html>
